syntax = "proto3";

package thrust.type;

option go_package = "github.com/thrustmc/thrust-proto/gen/go/thrust/type;typepb";
option java_multiple_files = true;
option java_outer_classname = "NamespacedNameProto";
option java_package = "io.github.thrustmc.proto.type";

message NamespacedName {
  string name = 1;
  string namespace = 2;
}
