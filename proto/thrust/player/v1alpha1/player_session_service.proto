syntax = "proto3";

package thrust.player.v1alpha1;

import "thrust/player/v1alpha1/player_session.proto";

option go_package = "github.com/thrustmc/thrust-proto/gen/go/thrust/player/v1alpha1;playerv1alpha1";
option java_multiple_files = true;
option java_outer_classname = "PlayerSessionServiceProto";
option java_package = "io.github.thrustmc.proto.player.v1alpha1";

service PlayerSessionService {
  rpc GetActiveSession(GetActiveSessionRequest) returns (GetActiveSessionResponse);
  rpc GetActiveSessionByGameProfileId(GetActiveSessionByGameProfileIdRequest) returns (GetActiveSessionByGameProfileIdResponse);
  rpc ListActiveSessions(ListActiveSessionsRequest) returns (ListActiveSessionsResponse);
}

message GetActiveSessionRequest {
  string session_id = 1;
}

message GetActiveSessionResponse {
  PlayerSession session = 1;
}

message GetActiveSessionByGameProfileIdRequest {
  string game_profile_id = 1;
}

message GetActiveSessionByGameProfileIdResponse {
  PlayerSession session = 1;
}

message ListActiveSessionsRequest {}

message ListActiveSessionsResponse {
  repeated PlayerSession sessions = 1;
}
