version: v2
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/protocolbuffers/java
    out: gen/java/src/main/java
  - remote: buf.build/grpc/java
    out: gen/java/src/main/java
inputs:
  - directory: proto
